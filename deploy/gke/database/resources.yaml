apiVersion: batch/v1
kind: Job
metadata:
  name: arch-security-tracker-database
spec:
  template:
    spec:
      containers:
        - name: database
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 1Gi
