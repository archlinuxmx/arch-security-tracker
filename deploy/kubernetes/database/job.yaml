apiVersion: batch/v1
kind: Job
metadata:
  name: arch-security-tracker-database
spec:
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: database
          image: arch-security-tracker:local
          args: [init]
          envFrom:
            - configMapRef:
                name: arch-security-tracker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/tracker
            - name: secret
              mountPath: /run/secrets/tracker
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arch-security-tracker
        - name: secret
          secret:
            secretName: arch-security-tracker
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
