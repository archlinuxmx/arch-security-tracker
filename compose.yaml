x-tracker: &tracker
  image: ${TRACKER_IMAGE:-localhost/arch-security-tracker:latest}
  platform: linux/amd64
  build:
    context: .
    dockerfile: Containerfile
  environment:
    TRACKER_PUBLIC_URL: ${TRACKER_PUBLIC_URL:-http://127.0.0.1:8080}
    TRACKER_SECRET_KEY_FILE: /run/secrets/tracker-secret
    TRACKER_PROXY_HOPS: ${TRACKER_PROXY_HOPS:-0}
  volumes:
    - tracker-data:/var/lib/tracker
  secrets:
    - tracker-secret
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true

services:
  web:
    <<: *tracker
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  maintenance:
    <<: *tracker
    command: [refresh-loop]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  tracker-data:

secrets:
  tracker-secret:
    file: ./secrets/tracker-secret
